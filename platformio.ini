; Coop water/air temperature node - Raspberry Pi Pico + RAK4631 (Meshtastic TEXTMSG)
; Uses the Earle Philhower Arduino core for RP2040/RP2350.

[platformio]
default_envs = pico

[env]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200
lib_deps =
    paulstoffregen/OneWire
    milesburton/DallasTemperature
    adafruit/Adafruit SH110X
    adafruit/Adafruit GFX Library

; Raspberry Pi Pico (RP2040) - default
[env:pico]
board = pico

; Raspberry Pi Pico 2 (RP2350) - use this one if you have a Pico 2
[env:pico2]
board = rpipico2
